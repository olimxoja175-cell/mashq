# Production-style stack. Copy .env.example to .env and fill in secrets first.
name: worldvoice

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worldvoice
      POSTGRES_USER: worldvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldvoice"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "no"]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      WV_DATABASE_URL: postgresql+asyncpg://worldvoice:${POSTGRES_PASSWORD}@postgres:5432/worldvoice
      WV_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WV_COOKIE_SECURE: "true"
      WV_ALLOWED_ORIGINS: '["https://${WV_DOMAIN:-localhost}"]'
      WV_TURN_URLS: '["turn:${WV_DOMAIN:-localhost}:3478?transport=udp","turns:${WV_DOMAIN:-localhost}:5349?transport=tcp"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      WV_DOMAIN: ${WV_DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend, frontend]
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${WV_TURN_SECRET:?set WV_TURN_SECRET}"]
    volumes: [./infra/turnserver.conf:/etc/coturn/turnserver.conf:ro]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
