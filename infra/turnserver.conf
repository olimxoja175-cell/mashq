# coturn: relays encrypted SRTP when peers cannot connect directly. It cannot decrypt media.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# static-auth-secret is passed on the command line from WV_TURN_SECRET
realm=worldvoice
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
min-port=49160
max-port=49200
